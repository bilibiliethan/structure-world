plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // fabric-loom 会自动添加 mavenCentral() 与 https://maven.fabricmc.net/
}

dependencies {
    //  Minecraft 本体、Yarn 映射、Fabric Loader
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"

    // 本模组只依赖 minecraft 本体 + loader（含 Mixin），无需 fabric-api。
    // 如后续扩展功能需要 fabric-api，可在此添加：
    // modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// 如果要用 Gradle 9+ 构建，确保本地 Gradle 版本匹配（见 README）。
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
