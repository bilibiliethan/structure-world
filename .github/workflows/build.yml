name: Build

# 触发时机：
#   - 推送到 main、或向 main 提 PR  → 编译验证
#   - 推送 v* 标签                  → 额外自动发布 Release 并附上 jar
#   - 也可在 Actions 页面手动点「Run workflow」
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连续推送时，取消上一次还没跑完的构建，省时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译模组
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # fabric-loom 1.18 要求 JDK 25 才能运行 Gradle 构建
      - name: 安装 JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # 自动缓存 ~/.gradle（Minecraft 本体、yarn 映射、loom 缓存），二次构建快很多
      - name: 配置 Gradle 与缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建
        run: ./gradlew build --no-daemon --stacktrace

      - name: 列出产物
        run: ls -la build/libs

      # 只保留可用的模组 jar，排除 -dev（开发用）和 -sources（源码）
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: mod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布 Release
    needs: build
    # 只有推送 v* 标签时才跑
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh 命令必须有 git 仓库才能确定「往哪个仓库发」，所以这里也要 checkout
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 下载已构建好的 jar
        uses: actions/download-artifact@v8
        with:
          name: mod-jar
          path: dist

      - name: 创建 Release 并附加 jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "${GITHUB_REF_NAME}" dist/*.jar \
            --repo "${GITHUB_REPOSITORY}" \
            --title "结构世界 ${GITHUB_REF_NAME}" \
            --generate-notes
